<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jubr.app</title>
  <meta name="description" content="Projects running on *.jubr.app">
  <style>
    :root { --bg: #fafafa; --fg: #111; --muted: #666; --card: #fff; --border: #e5e5e5; --up: #16a34a; --down: #dc2626; --wait: #a3a3a3; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0a0a0a; --fg: #eee; --muted: #999; --card: #161616; --border: #2a2a2a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 4px; font-size: 2rem; }
    p.sub { margin: 0 0 32px; color: var(--muted); }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    a.card { display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
    a.card:hover { border-color: var(--muted); transform: translateY(-1px); }
    .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--wait); }
    .dot.up { background: var(--up); }
    .dot.down { background: var(--down); }
    .info { min-width: 0; }
    .name { font-weight: 600; }
    .host { color: var(--muted); font-size: .875rem; font-family: ui-monospace, monospace; }
    .desc { color: var(--muted); font-size: .9rem; }
    footer { margin-top: 40px; color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <h1>jubr.app</h1>
    <p class="sub">Projects running on <code>*.jubr.app</code></p>
    <ul id="projects"></ul>
    <footer>Green = reachable, red = unreachable, grey = checking. Status refreshes every minute; the list updates itself every 6 hours.</footer>
  </main>

  <script>
    // Generated by scripts/update.py — don't edit by hand, use overrides.json.
    // PROJECTS:START
    const PROJECTS = [
      {
        "sub": "clip",
        "name": "Clip",
        "desc": ""
      },
      {
        "sub": "food",
        "name": "ViscosiGuide — Karte",
        "desc": "Der Food- & Restaurant-Guide für Viscosi Emmenbrücke."
      },
      {
        "sub": "fw",
        "name": "🚒 Hydrantennavigator",
        "desc": "Hydrantennavigator – den nächsten Hydranten finden und die Schlauchlänge berechnen."
      },
      {
        "sub": "gotthard",
        "name": "Gotthard Verkehr Live",
        "desc": "Gotthard Verkehr aktuell: Live-Stau, Wartezeiten und Sperrungen am Gotthard-Strassentunnel (Nord Göschenen / Süd Airolo) sowie Status des Gotthardpasses."
      },
      {
        "sub": "learn",
        "name": "Study Portal",
        "desc": ""
      },
      {
        "sub": "rail",
        "name": "Travel on Rail — Interrail Tracker",
        "desc": ""
      }
    ];
    // PROJECTS:END

    const list = document.getElementById("projects");
    const dots = [];

    for (const p of PROJECTS) {
      const url = `https://${p.sub}.jubr.app`;
      const li = document.createElement("li");
      li.innerHTML = `
        <a class="card" href="${url}" target="_blank" rel="noopener">
          <span class="dot" title="checking…"></span>
          <span class="info">
            <div class="name"></div>
            <div class="host">${p.sub}.jubr.app</div>
            ${p.desc ? '<div class="desc"></div>' : ""}
          </span>
        </a>`;
      li.querySelector(".name").textContent = p.name;
      if (p.desc) li.querySelector(".desc").textContent = p.desc;
      list.appendChild(li);

      dots.push([url, li.querySelector(".dot")]);
    }

    // Reachability check: a no-cors fetch resolves if the host answers at all.
    function check() {
      for (const [url, dot] of dots) {
        const signal = AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined;
        fetch(url, { mode: "no-cors", cache: "no-store", signal })
          .then(() => { dot.className = "dot up"; dot.title = "reachable"; })
          .catch(() => { dot.className = "dot down"; dot.title = "unreachable"; });
      }
    }
    check();
    setInterval(check, 60_000);
  </script>
</body>
</html>
